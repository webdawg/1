name: Typecheck

on:
  push:
    branches: [master]

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: tui/package-lock.json
      - run: npm ci
        working-directory: tui
      - run: npm run typecheck
        working-directory: tui
